<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GeneralProtec - Breach Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha3/0.9.3/sha3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
#matrix-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.025;pointer-events:none}
.container{position:relative;z-index:1;max-width:860px;width:100%;padding:48px 28px;margin:0 auto}
.header{text-align:center;margin-bottom:36px}
.logo{text-align:center;margin-bottom:14px}
.logo img{height:72px;width:auto}
.header h1{font-size:38px;font-weight:700;margin-bottom:10px;background:linear-gradient(135deg,#00ff41,#00b8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:#ccc;font-size:16px;line-height:1.5}
.tabs{display:flex;gap:0;margin-bottom:20px;background:#12121a;border-radius:12px;border:1px solid #1e1e2e;overflow:hidden}
.tab-btn{flex:1;padding:16px 10px;border:none;background:transparent;color:#aaa;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.tab-btn:hover{color:#ddd}
.tab-btn.active{color:#00ff41;background:#1a1a28}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.search-box{background:#12121a;border:1px solid #1e1e2e;border-radius:16px;padding:28px;margin-bottom:16px}
.search-box label{display:block;font-size:14px;color:#ddd;margin-bottom:10px;font-weight:500}
.input-group{display:flex;gap:10px}
.input-group input{flex:1;padding:16px 20px;border-radius:10px;border:1px solid #2a2a3e;background:#1a1a28;color:#e0e0e0;font-size:17px;outline:none;transition:border-color .2s}
.input-group input:focus{border-color:#00ff41}
.btn{padding:16px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,#00ff41,#00b8ff);color:#0a0a0f;font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s,opacity .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.spinner{display:none;width:22px;height:22px;border:2px solid #2a2a3e;border-top-color:#00ff41;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.result-box{background:#12121a;border:1px solid #1e1e2e;border-radius:16px;padding:28px;display:none;margin-top:8px}
.result-box.show{display:block}
.result-header{display:flex;align-items:center;gap:18px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1e1e2e}
.status-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.status-icon.safe{background:rgba(0,255,65,.12);color:#00ff41}
.status-icon.breached{background:rgba(255,50,50,.12);color:#ff4444}
.status-icon.info{background:rgba(0,184,255,.12);color:#00b8ff}
.status-icon.warn{background:rgba(255,180,0,.12);color:#ffb400}
.result-email{font-size:15px;color:#ccc}
.result-count{font-size:22px;font-weight:700}
.info-msg{font-size:14px;color:#bbb;text-align:center;margin-top:14px;line-height:1.5}
.info-msg a{color:#00b8ff}
.section-title{font-size:15px;font-weight:600;color:#ccc;text-transform:uppercase;letter-spacing:1px;margin:24px 0 14px}
.breach-card{background:#1a1a28;border:1px solid #242440;border-radius:12px;padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.breach-card:hover{border-color:#3a3a5e}
.breach-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.breach-name{font-weight:700;font-size:17px;color:#e0e0e0;display:flex;align-items:center;gap:8px}
.breach-name .logo-img{width:22px;height:22px;border-radius:4px;object-fit:contain}
.breach-domain{font-size:13px;color:#bbb;margin-top:3px}
.breach-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.badge-records{background:rgba(0,184,255,.12);color:#00b8ff}
.badge-year{background:rgba(255,180,0,.12);color:#ffb400}
.badge-risk-easy{background:rgba(255,50,50,.15);color:#ff4444}
.badge-risk-plain{background:rgba(200,30,30,.2);color:#ff6666}
.badge-risk-hard{background:rgba(255,180,0,.12);color:#ffb400}
.badge-risk-unknown{background:rgba(120,120,120,.15);color:#bbb}
.badge-industry{background:rgba(0,255,65,.08);color:#55ff77}
.breach-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #242440;font-size:14px;color:#ccc;line-height:1.7}
.breach-details.open{display:block}
.data-tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.data-tag{font-size:12px;padding:4px 10px;border-radius:5px;background:rgba(0,184,255,.08);color:#88ddff;border:1px solid rgba(0,184,255,.15)}
.risk-score-box{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:15px;font-weight:600}
.risk-low{background:rgba(0,255,65,.1);color:#00ff41}
.risk-medium{background:rgba(255,180,0,.1);color:#ffb400}
.risk-high{background:rgba(255,50,50,.1);color:#ff4444}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.metric-card{background:#1a1a28;border:1px solid #242440;border-radius:10px;padding:16px;min-height:80px}
.metric-card h4{font-size:12px;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.show-all-btn{background:transparent;border:1px solid #2a2a3e;color:#ccc;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;display:block;margin:12px auto 0;transition:all .15s}
.show-all-btn:hover{border-color:#00ff41;color:#00ff41}
.footer{text-align:center;padding:40px 24px;color:#999;font-size:13px}
.footer a{color:#aaa;text-decoration:none}
.footer a:hover{color:#00ff41}
.rate-note{font-size:12px;color:#999;text-align:right;margin-top:8px}
.export-bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.export-bar .btn-sm{padding:10px 18px;font-size:13px;background:transparent;border:1px solid #2a2a3e;color:#ccc;border-radius:8px;cursor:pointer;transition:all .15s}
.export-bar .btn-sm:hover{border-color:#00ff41;color:#00ff41}
.domain-check-link{display:inline-block;margin:8px 0;font-size:13px;color:#00b8ff;cursor:pointer;text-decoration:underline}
.domain-check-link:hover{color:#66ddff}
.paste-card{background:#1a1a28;border:1px solid #442, border-radius:10px;padding:14px;margin:8px 0}
.paste-card .paste-meta{font-size:12px;color:#999;margin:4px 0}
.batch-progress{font-size:14px;color:#00b8ff;margin:10px 0;text-align:center}
.batch-summary{background:#1a1a28;border:1px solid #242440;border-radius:10px;padding:16px;margin:8px 0}
.batch-summary-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e1e2e;font-size:13px}
.batch-summary-item:last-child{border-bottom:none}
.breaches-table{max-height:500px;overflow-y:auto}
.breaches-table::-webkit-scrollbar{width:6px}
.breaches-table::-webkit-scrollbar-track{background:#12121a}
.breaches-table::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:4px}
@media(max-width:600px){
.container{padding:24px 14px}
.header h1{font-size:28px}
.search-box{padding:18px}
.input-group{flex-direction:column}
.btn{width:100%;text-align:center}
.tabs{border-radius:8px}
.tab-btn{font-size:13px;padding:14px 6px}
.metrics-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div class="container">
<div class="header">
<div class="logo"><img src="logo.jpg" alt="GeneralProtec"></div>
<h1>Breach Checker</h1>
<p>Verifica si tu email o contraseña están en filtraciones conocidas.</p>
</div>
<div class="tabs">
<button class="tab-btn active" onclick="switchTab('email')">Email</button>
<button class="tab-btn" onclick="switchTab('password')">Contraseña</button>
<button class="tab-btn" onclick="switchTab('breaches')">Filtraciones</button>
</div>
<div class="tab-content active" id="tab-email">
<div class="search-box">
<label for="email">Correo electrónico</label>
<div class="input-group">
<input type="text" id="email" placeholder="ejemplo@correo.com (o varios separados por coma)" autocomplete="off">
<button class="btn" id="email-btn" onclick="checkEmail()">
<span id="email-btn-text">Verificar</span>
<span class="spinner" id="email-spinner"></span>
</button>
</div>
</div>
<div class="result-box" id="email-result">
<div class="result-header" id="email-result-header"></div>
<div id="email-breaches-container"></div>
<div id="email-metrics-container"></div>
<div class="info-msg" id="email-info"></div>
</div>
</div>
<div class="tab-content" id="tab-password">
<div class="search-box">
<label for="password">Contraseña a verificar</label>
<div class="input-group">
<input type="password" id="password" placeholder="Escribe una contraseña..." autocomplete="off">
<button class="btn" id="pwd-btn" onclick="checkPassword()">
<span id="pwd-btn-text">Verificar</span>
<span class="spinner" id="pwd-spinner"></span>
</button>
</div>
<div class="rate-note">Tu contraseña nunca sale de tu navegador (k-anonymity).</div>
</div>
<div class="result-box" id="pwd-result">
<div class="result-header" id="pwd-result-header"></div>
<div class="info-msg" id="pwd-info"></div>
</div>
</div>
<div class="tab-content" id="tab-breaches">
<div class="search-box">
<label for="domain">Filtrar por dominio (opcional)</label>
<div class="input-group">
<input type="text" id="domain" placeholder="ejemplo.com" autocomplete="off">
<button class="btn" id="breaches-btn" onclick="fetchBreaches()">
<span id="breaches-btn-text">Buscar</span>
<span class="spinner" id="breaches-spinner"></span>
</button>
</div>
</div>
<div class="result-box" id="breaches-result">
<div class="result-header" id="breaches-result-header"></div>
<div class="breaches-table" id="breaches-list"></div>
<div class="info-msg" id="breaches-info"></div>
</div>
</div>
<div class="footer">
<a href="https://generalprotec.com" target="_blank">GeneralProtec</a> &middot; <a href="ayuda.html">Guía</a> &middot; Datos: <a href="https://xposedornot.com" target="_blank">XposedOrNot</a>
</div>
</div>
<script>
let lastData=null,batchEmails=[],batchIdx=0;
const canvas=document.getElementById('matrix-canvas');
const ctx=canvas.getContext('2d');
let w,h,cols,drops;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;cols=Math.floor(w/14);drops=Array(cols).fill(1)}
resize();window.addEventListener('resize',resize);
setInterval(()=>{ctx.fillStyle='rgba(10,10,15,0.05)';ctx.fillRect(0,0,w,h);ctx.fillStyle='#00ff41';ctx.font='14px monospace';for(let i=0;i<drops.length;i++){ctx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*14,drops[i]*14);if(drops[i]*14>h&&Math.random()>0.975)drops[i]=0;drops[i]++}},50);

function switchTab(n){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelector('.tab-btn:nth-child('+(n==='email'?1:n==='password'?2:3)+')').classList.add('active');document.getElementById('tab-'+n).classList.add('active')}
const api=p=>fetch('/.netlify/functions/check?'+new URLSearchParams(p)).then(r=>r.json());
function ld(b,s,l,v){document.getElementById(b).disabled=v;document.getElementById(s).textContent=v?'Verificando...':'Verificar';document.getElementById(l).classList.toggle('show',v)}
function riskBadge(r){return r==='easytocrack'?'badge-risk-easy':r==='plaintext'?'badge-risk-plain':r==='hardtocrack'?'badge-risk-hard':'badge-risk-unknown'}
function riskLabel(r){return tr(r)}
function fmt(n){if(!n)return'';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return n}
const t={
'Email addresses':'Correos','Passwords':'Contraseñas','Usernames':'Usuarios','Names':'Nombres','Phone numbers':'Teléfonos','IP addresses':'IPs','Dates of birth':'Fechas nac.','Geographic locations':'Ubicación','Profile photos':'Fotos','Physical addresses':'Direcciones','Credit cards':'Tarjetas crédito','Bank accounts':'Cuentas bancarias','Social media':'Redes sociales','Security questions':'Preguntas seg.','Government IDs':'IDs gobierno','Website activity':'Actividad web','Purchases':'Compras','Genders':'Géneros','Employers':'Empleadores','Education':'Educación','Job titles':'Cargos','Relationships':'Relaciones','Ethnicity':'Etnia','Income':'Ingresos','Insurance':'Seguros','Medical':'Médico',
'Information Technology':'Tecnología','Food':'Alimentación','Retail':'Ventas','Entertainment':'Entretenimiento','Electronics':'Electrónica','Finance':'Finanzas','Health':'Salud','Education':'Educación','Gaming':'Videojuegos','Social Media':'Redes','Telecommunications':'Telecom','Transportation':'Transporte','Hospitality':'Hospitalidad','Non Profit':'ONG','Government':'Gobierno','Manufacturing':'Manufactura','Energy':'Energía','News':'Noticias','Sports':'Deportes','Pharmaceutical':'Farmacéutica',
'PlainText':'Texto plano','EasyToCrack':'Fácil romper','StrongHash':'Hash seguro','Unknown':'Desconocido','Facil':'Fácil','TextoPlano':'Texto plano','HashSeguro':'Hash seguro','Desconocido':'Desc.',
'Yes':'Sí','No':'No','Low':'Bajo','Medium':'Medio','High':'Alto',
'HardToCrack':'Hash seguro','easytocrack':'Fácil','plaintext':'Texto plano','hardtocrack':'Hash seguro'}
function tr(s){return t[s]||s}
function trData(s){return s.split(';').map(x=>tr(x.trim())).join(';')}
function trList(arr){return arr.map(x=>tr(x.trim()))}
function td(e){const d=e.currentTarget.querySelector('.breach-details');if(d)d.classList.toggle('open')}
function sa(b){const c=b.parentElement;for(let i=0;i<c.children.length;i++){const ch=c.children[i];if(ch.classList.contains('breach-card')&&ch.style.display==='none')ch.style.display=''};b.style.display='none'}


function renderTimeline(years){
if(!years)return'';
const entries=Object.entries(years[0]||{}).filter(([k])=>k.startsWith('y')).map(([k,v])=>({year:k.substring(1),count:v}));
const max=Math.max(...entries.map(e=>e.count),1);
if(max===0)return'';
let bars='';entries.forEach(e=>{const pct=Math.max(4,(e.count/max)*100);bars+='<div style="flex:1;text-align:center"><div style="height:'+pct+'px;background:linear-gradient(180deg,#00b8ff,#00ff41);border-radius:3px 3px 0 0;min-height:4px;width:100%"></div><div style="font-size:9px;color:#666;margin-top:3px">'+e.year+'</div><div style="font-size:9px;color:#999">'+e.count+'</div></div>'});
return'<div class="metric-card"><h4>Filtraciones por a&#241;o</h4><div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding-top:10px">'+bars+'</div></div>'}

function renderPastes(a){
const ps=a.PastesSummary;
if(!ps||!ps.cnt||ps.cnt==0)return'';
const ep=a.ExposedPastes;
let html='<div class="metric-card" style="grid-column:1/-1"><h4>Exposici&#243;n en Pastes</h4><div style="font-size:13px;color:#ffb400">'+ps.cnt+' paste(s) encontrados</div>';
if(ep&&ep.length>0){ep.slice(0,5).forEach(p=>{
const src=p.source||p.Source||'Desconocido',date=p.date||p.Date||'',email=p.email||p.Email||'';
html+='<div class="paste-card" style="margin:6px 0;padding:10px;background:#12121a;border-radius:8px;font-size:12px"><strong style="color:#ddd">'+(src)+'</strong>'+(date?' <span style="color:#888">'+date+'</span>':'')+(email?'<br><span style="color:#888">'+email+'</span>':'')+'</div>'})}
html+='</div>';return html}

async function checkEmail(){
const i=document.getElementById('email'),raw=i.value.trim();
if(!raw){i.style.borderColor='#ff3232';setTimeout(()=>i.style.borderColor='',1500);return}
const emails=raw.split(/[,;\n]+/).map(e=>e.trim().toLowerCase()).filter(e=>e.includes('@'));
if(emails.length===0){i.style.borderColor='#ff3232';setTimeout(()=>i.style.borderColor='',1500);return}
ld('email-btn','email-btn-text','email-spinner',true);document.getElementById('email-result').classList.remove('show');
batchEmails=emails;batchIdx=0;await checkSingleEmail(0);ld('email-btn','email-btn-text','email-spinner',false)}

async function checkSingleEmail(idx){
const e=batchEmails[idx];
const h=document.getElementById('email-result-header'),c=document.getElementById('email-breaches-container'),m=document.getElementById('email-metrics-container'),info=document.getElementById('email-info');
if(batchEmails.length>1)c.innerHTML='<div class="batch-progress">Verificando '+(idx+1)+' de '+batchEmails.length+': '+e+'</div>';
try{
const d=await api({email:e,analytics:'1'});
if(!d.ok)throw new Error(d.error);
lastData=d;
if(batchEmails.length>1){
const summary=batchEmails.map((em,i)=>({email:em,found:i<=idx?(i===idx?d.total:'?'):'?'}));
let sh='<div class="section-title">Resumen batch</div><div class="batch-summary">';
summary.forEach(s=>{sh+='<div class="batch-summary-item"><span>'+(s.found==='?'?'⏳':s.found>0?'⚠️':'✅')+' '+s.email+'</span><span style="color:'+(s.found>0?'#ff4444':'#00ff41')+'">'+(s.found==='?'?'...':s.found>0?s.found+' filtraciones':'Limpio')+'</span></div>'});
sh+='</div>';c.innerHTML=sh}
renderEmailSingle(d,e);
if(batchEmails.length>1&&idx<batchEmails.length-1){
const btns='<div class="export-bar" style="justify-content:center"><button class="btn-sm" onclick="batchIdx='+idx+';checkNextEmail()">Siguiente: '+batchEmails[idx+1]+'</button></div>';
info.innerHTML+=btns}}
catch(e2){
h.innerHTML='<div class="status-icon info">&#x2139;</div><div><div class="result-count">Error: '+e2.message+'</div><div class="result-email">'+e+'</div></div>';
info.innerHTML='<a href="https://haveibeenpwned.com" target="_blank" style="color:#00b8ff">Have I Been Pwned</a>'}
document.getElementById('email-result').classList.add('show')}
function checkNextEmail(){batchIdx++;if(batchIdx<batchEmails.length)checkSingleEmail(batchIdx)}

function renderEmailSingle(d,e){
const h=document.getElementById('email-result-header'),c=document.getElementById('email-breaches-container'),m=document.getElementById('email-metrics-container'),info=document.getElementById('email-info');
if(d.total===0){
h.innerHTML='<div class="status-icon safe">&#x2713;</div><div><div class="result-count">Sin filtraciones</div><div class="result-email">'+e+'</div></div>';
c.innerHTML='';m.innerHTML='';info.innerHTML='Tu email no aparece en filtraciones conocidas.';return}
h.innerHTML='<div class="status-icon breached">&#x26A0;</div><div><div class="result-count">'+d.total+' filtraci&#243;n(es)</div><div class="result-email">'+e+'</div></div>';
const dd=d.analytics?.ExposedBreaches?.breaches_details||[],dm={};dd.forEach(x=>{dm[x.breach]=x});
let ch='<div class="section-title">Filtraciones encontradas</div>';
const mv=12,sa2=d.total<=mv;
d.breaches.forEach((n,i)=>{
const x=dm[n],rc=x?riskBadge(x.password_risk):'',rl=x?riskLabel(x.password_risk):'',rec=x?fmt(x.xposed_records):'',yr=x?x.xposed_date:'',ind=x?tr(x.industry):'',dom=x?x.domain:'',exp=x?trData(x.xposed_data):'',desc=x?x.details:'',logo=x?'https://xposedornot.com/static/logos/'+x.logo:'',h2=!sa2&&i>=mv?' style="display:none"':'';
ch+='<div class="breach-card" onclick="td(event)"'+h2+'><div class="breach-card-header"><div><div class="breach-name">'+(logo?'<img class="logo-img" src="'+logo+'" alt="" onerror="this.style.display=\'none\'">':'')+n+'</div>'+(dom?'<div class="breach-domain">'+dom+'</div>':'')+'</div><div class="breach-badges">'+(rec?'<span class="badge badge-records">'+rec+'</span>':'')+(yr?'<span class="badge badge-year">'+yr+'</span>':'')+(ind?'<span class="badge badge-industry">'+ind+'</span>':'')+(rc?'<span class="badge '+rc+'">'+rl+'</span>':'')+'</div></div>'+(exp?'<div class="data-tags">'+exp.split(';').map(t=>'<span class="data-tag">'+t.trim()+'</span>').join('')+'</div>':'')+(desc?'<div class="breach-details"><strong>Detalles:</strong> '+desc+'</div>':'')+'</div>'});
if(!sa2)ch+='<button class="show-all-btn" onclick="sa(this)">Mostrar todas ('+d.total+')</button>';
c.innerHTML=ch;
const a=d.analytics;
if(a){let mh='<div class="section-title">An&#225;lisis de riesgo</div><div class="metrics-grid">';
const rk=a.BreachMetrics?.risk?.[0];
if(rk){const lv=(rk.risk_label||'').toLowerCase(),cls=lv==='low'?'risk-low':lv==='medium'?'risk-medium':'risk-high';mh+='<div class="metric-card"><h4>Nivel de riesgo</h4><div class="risk-score-box '+cls+'">'+rk.risk_label+' &middot; '+rk.risk_score+'/10</div></div>'}
const pw=a.BreachMetrics?.passwords_strength?.[0];
if(pw){mh+='<div class="metric-card"><h4>Fortaleza de contrase&#241;as</h4>';const items=[{label:'Texto plano',key:'PlainText',color:'#ff4444'},{label:'F&#225;cil de romper',key:'EasyToCrack',color:'#ff8800'},{label:'Hash seguro',key:'StrongHash',color:'#00ff41'},{label:'Desconocido',key:'Unknown',color:'#888'}];const mv2=Math.max(...items.map(i=>pw[i.key]||0),1);items.forEach(it=>{const v=pw[it.key]||0,pct=Math.max(4,(v/mv2)*100);mh+='<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px"><span style="width:90px;flex-shrink:0;color:#888">'+it.label+'</span><div style="flex:1;height:14px;background:#1e1e2e;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+it.color+';border-radius:4px;min-width:4px"></div></div><span style="color:#aaa;width:30px;text-align:right">'+v+'</span></div>'});mh+='</div>'}
const ind2=a.BreachMetrics?.industry?.[0];
if(ind2&&ind2.length>0){const v=ind2.filter(i=>i[1]>0).slice(0,6);if(v.length>0){const mx=Math.max(...v.map(i=>i[1]),1);mh+='<div class="metric-card"><h4>Industrias m&#225;s afectadas</h4>';v.forEach(it=>{const pct=Math.max(4,(it[1]/mx)*100);mh+='<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px"><span style="width:90px;flex-shrink:0;color:#888">'+tr(it[0])+'</span><div style="flex:1;height:14px;background:#1e1e2e;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#00b8ff,#00ff41);border-radius:4px;min-width:4px"></div></div><span style="color:#aaa;width:30px;text-align:right">'+it[1]+'</span></div>'});mh+='</div>'}}
const xd=a.BreachMetrics?.xposed_data?.[0];
if(xd&&xd.children){const tags=[];xd.children.forEach(l2=>{if(l2.children)l2.children.forEach(l3=>{if(l3.name)tags.push(l3.name.replace('data_','').replace(/_/g,' '))})});if(tags.length>0){mh+='<div class="metric-card"><h4>Tipos de datos expuestos</h4><div class="data-tags">'+tags.map(t=>'<span class="data-tag">'+tr(t)+'</span>').join('')+'</div></div>'}}
mh+=renderTimeline(a.BreachMetrics?.yearwise_details);
mh+=renderPastes(a);
mh+='</div>';m.innerHTML=mh}
const domPart=e.split('@')[1];
const domainHtml=domPart?'<span class="domain-check-link" onclick="checkDomain(\''+domPart+'\')">Ver filtraciones para @'+domPart+'</span>':'';
info.innerHTML='Cambia las contrase&#241;as afectadas. Usa autenticaci&#243;n en dos pasos.<br>'+domainHtml;
const exportBar='<div class="export-bar"><button class="btn-sm" onclick="exportJSON()">Exportar JSON</button><button class="btn-sm" onclick="exportTXT()">Exportar TXT</button></div>';
info.innerHTML+=exportBar}

function checkDomain(dom){switchTab('breaches');document.getElementById('domain').value=dom;fetchBreaches()}

function exportJSON(){if(!lastData)return;const b=new Blob([JSON.stringify(lastData,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='breach-report.json';a.click();URL.revokeObjectURL(a.href)}
function exportTXT(){if(!lastData)return;
let txt='=== GeneralProtec Breach Report ===\nEmail: '+lastData.email+'\nTotal breaches: '+lastData.total+'\n\nBreaches:\n';
(lastData.breaches||[]).forEach(n=>{txt+='- '+n+'\n'});
const dd=lastData.analytics?.ExposedBreaches?.breaches_details||[];
dd.forEach(d=>{txt+='\n'+d.breach+':\n  Domain: '+d.domain+'\n  Date: '+d.xposed_date+'\n  Records: '+d.xposed_records+'\n  Data: '+d.xposed_data+'\n  Risk: '+d.password_risk+'\n  Description: '+d.details+'\n'});
const b=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='breach-report.txt';a.click();URL.revokeObjectURL(a.href)}

async function checkPassword(){
const i=document.getElementById('password'),p=i.value.trim();
if(!p){i.style.borderColor='#ff3232';setTimeout(()=>i.style.borderColor='',1500);return}
ld('pwd-btn','pwd-btn-text','pwd-spinner',true);document.getElementById('pwd-result').classList.remove('show');
try{
if(typeof keccak_512==='undefined')throw new Error('Librer&#237;a de hash no cargada');
const hash=keccak_512(p),prefix=hash.substring(0,10);
const d=await api({password:prefix});
if(!d.ok)throw new Error(d.error);
const h=document.getElementById('pwd-result-header'),info=document.getElementById('pwd-info');
if(!d.found){
h.innerHTML='<div class="status-icon safe">&#x2713;</div><div><div class="result-count">No encontrada</div><div class="result-email">Esta contrase&#241;a no aparece en filtraciones</div></div>';
info.innerHTML='Buena noticia. La contrase&#241;a no se ha filtrado en ninguna brecha conocida.'}
else{
const r=d.result;
h.innerHTML='<div class="status-icon breached">&#x26A0;</div><div><div class="result-count">&#161;Filtrada!</div><div class="result-email">Aparece '+parseInt(r.count).toLocaleString()+' veces</div></div>';
let ch='';if(r.char){const parts=r.char.split(';');parts.forEach(p=>{const[k,v]=p.split(':');const labels={D:'D&#237;gitos',A:'Letras',S:'Especiales',L:'Longitud'};ch+='<div class="rate-note" style="text-align:left"><strong>'+labels[k]+':</strong> '+v+'</div>'})}
info.innerHTML=ch+'<br>No uses esta contrase&#241;a. C&#225;mbiala inmediatamente.'}
document.getElementById('pwd-result').classList.add('show')}
catch(e){
document.getElementById('pwd-result-header').innerHTML='<div class="status-icon info">&#x2139;</div><div><div class="result-count">Error</div><div class="result-email">'+e.message+'</div></div>';
document.getElementById('pwd-info').textContent='Intenta de nuevo m&#225;s tarde.';document.getElementById('pwd-result').classList.add('show')}
finally{ld('pwd-btn','pwd-btn-text','pwd-spinner',false)}}

async function fetchBreaches(){
const i=document.getElementById('domain'),dom=i.value.trim().toLowerCase();
ld('breaches-btn','breaches-btn-text','breaches-spinner',true);document.getElementById('breaches-result').classList.remove('show');
try{
const params={breaches:'1'};if(dom)params.domain=dom;
const d=await api(params);
if(!d.ok)throw new Error(d.error);
const h=document.getElementById('breaches-result-header'),list=document.getElementById('breaches-list'),info=document.getElementById('breaches-info');
h.innerHTML='<div class="status-icon '+(d.total>0?'warn':'safe')+'">'+(d.total>0?'&#x26A0;':'&#x2713;')+'</div><div><div class="result-count">'+d.total+' filtraci&#243;n(es)'+(dom?' para '+dom:'')+'</div><div class="result-email">Base de datos XposedOrNot</div></div>';
if(d.total===0){list.innerHTML='';info.innerHTML='No hay filtraciones'+(dom?' para '+dom:'')+'.';document.getElementById('breaches-result').classList.add('show');return}
let lh='';d.breaches.slice(0,200).forEach(b=>{
const rec=fmt(b.exposedRecords),yr=b.breachedDate?b.breachedDate.substring(0,4):'',data=trList(b.exposedData||[]).join(', ');
lh+='<div class="breach-card" onclick="td(event)"><div class="breach-card-header"><div><div class="breach-name">'+(b.logo?'<img class="logo-img" src="'+b.logo+'" alt="" onerror="this.style.display=\'none\'">':'')+b.breachID+'</div><div class="breach-domain">'+b.domain+'</div></div><div class="breach-badges">'+(rec?'<span class="badge badge-records">'+rec+'</span>':'')+(yr?'<span class="badge badge-year">'+yr+'</span>':'')+'<span class="badge badge-industry">'+tr(b.industry)+'</span></div></div>'+(data?'<div class="data-tags">'+data.split(', ').map(t=>'<span class="data-tag">'+t.trim()+'</span>').join('')+'</div>':'')+'<div class="breach-details"><strong>Descripci&#243;n:</strong> '+(b.exposureDescription||'Sin descripci&#243;n')+'</div></div>'});
list.innerHTML=lh;info.innerHTML='';document.getElementById('breaches-result').classList.add('show')}
catch(e){
document.getElementById('breaches-result-header').innerHTML='<div class="status-icon info">&#x2139;</div><div><div class="result-count">Error</div><div class="result-email">'+e.message+'</div></div>';
document.getElementById('breaches-info').textContent='Intenta de nuevo.';document.getElementById('breaches-result').classList.add('show')}
finally{ld('breaches-btn','breaches-btn-text','breaches-spinner',false)}}

document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')checkEmail()});
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')checkPassword()});
document.getElementById('domain').addEventListener('keydown',e=>{if(e.key==='Enter')fetchBreaches()});
</script>
</body>
</html>
